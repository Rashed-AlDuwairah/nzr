name: nzr
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # Networking
  dio: ^5.4.0

  # Download & Storage
  background_downloader: ^8.5.0
  photo_manager: ^3.3.0
  path_provider: ^2.1.2

  # Video Playback
  video_player: ^2.8.3
  chewie: ^1.7.4

  # Local Database
  isar: ^3.1.0+1
  isar_flutter_libs: ^3.1.0+1

  # Dependency Injection & Routing
  get_it: ^7.6.7
  go_router: ^13.2.0
  flutter_bloc: ^8.1.3

  # UI
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0
  haptic_feedback: ^0.5.1+1
  share_plus: ^7.2.1

  # Notifications
  flutter_local_notifications: ^17.2.0

  # Share Extension
  receive_sharing_intent: ^1.8.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  build_runner: ^2.4.8
  isar_generator: ^3.1.0+1

flutter:
  uses-material-design: false
